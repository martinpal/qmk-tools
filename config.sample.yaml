# =============================================================================
# QMK Keyboard Overlay - Configuration File
# =============================================================================
# This is a sample configuration file. Copy it to config.yaml and adjust the
# values to match your setup.
#
# By default, the overlay looks for config.yaml in the current directory.
# You can override this with the --config <path> command-line option.
#
# Precedence (highest to lowest):
#   1. Command-line arguments (override everything)
#   2. Environment variables (for secrets like tokens)
#   3. config.yaml values
#   4. Built-in defaults
#
# Lines commented out with # show the default value.
# =============================================================================

# -----------------------------------------------------------------------------
# Overlay window
# -----------------------------------------------------------------------------
overlay:
  # X position of the overlay window (pixels from left edge)
  # x: 0

  # Y position of the overlay window (pixels from top edge)
  # y: 0

  # Keyboard selection.
  #   - Integer index (1-based) of the keyboard from the detected list
  #   - "VID:PID" hex string (e.g. "FEED:6060")
  #   - Omit to auto-select the first detected keyboard
  # keyboard: 1

# -----------------------------------------------------------------------------
# Boblight integration - ambient LED lighting feedback based on keyboard layer
# -----------------------------------------------------------------------------
boblight:
  # Enable boblight integration (requires boblightd running)
  # enabled: false

  # Boblight server hostname/IP
  # host: localhost

  # Boblight server port
  # port: 19333

  # Boblight priority. LOWER = higher priority.
  # Use 255 to disable, boblight-X11 uses 128.
  # priority: 100

  # Comma-separated list of LED indices to control (e.g. [0, 1, 2, 3, 4, 5]).
  # Omit or leave null to control all LEDs.
  # leds: [0, 1, 2, 3, 4, 5]

# -----------------------------------------------------------------------------
# Home Assistant integration - dynamic brightness scaling
# -----------------------------------------------------------------------------
# Scales boblight LED brightness based on a Home Assistant light entity's
# state combined with solar elevation (time of day).
# Requires boblight to be enabled.
home_assistant:
  # Enable Home Assistant integration
  # enabled: false

  # Home Assistant base URL
  # url: http://homeassistant.local:8123

  # Long-lived access token.
  # Create one in Home Assistant: Profile -> Long-Lived Access Tokens.
  # Can also be set via the HASS_TOKEN environment variable (recommended for
  # secrets so the token is not stored in the config file).
  # token: "eyJhbGciOi..."

  # Light entity_id to monitor (e.g. light.living_room)
  # entity: light.velke_svetlo_v_obyvaku

  # Minimum boblight brightness when the light is off (0.0 - 1.0)
  # min_brightness: 0.25

  # Polling interval for Home Assistant state in seconds
  # poll_interval: 5.0

  # Solar brightness - adjusts brightness based on sun elevation for a natural
  # daylight curve. Uses max(light_brightness, solar_brightness) so whichever
  # is brighter wins.
  solar:
    # Enable solar brightness calculations
    # enabled: true

    # Latitude for solar position calculations (Brno, CZ by default)
    # latitude: 49.19

    # Longitude for solar position calculations (Brno, CZ by default)
    # longitude: 16.61

  # Light color sync - sets a Home Assistant light to the active keyboard
  # layer's color when a non-base layer is activated, and triggers an
  # automation when returning to the base layer to re-sync lights.
  color:
    # Enable layer color sync to a Home Assistant light
    # enabled: false

    # Light entity_id to control color on.
    # Defaults to the same entity as 'entity' above if omitted.
    # entity: light.living_room

    # When returning to the base layer, qmk-tools queries Home Assistant for
    # the most recently activated scene, script, automation, or tag and
    # re-triggers it. This restores the correct light mode (sun-following,
    # dark scene, etc.) without any configuration here.

# -----------------------------------------------------------------------------
# MQTT integration - publish keyboard layer state as events
# -----------------------------------------------------------------------------
# Publishes the active layer (name + color) to a retained MQTT topic on every
# layer change, instead of qmk-tools commanding a light directly. A Home
# Assistant automation subscribes to the topic and decides how to react
# (apply the color, scale it, ignore it, restore a scene on base layer, etc).
mqtt:
  # Enable MQTT layer-state publishing
  # enabled: false

  # MQTT broker host
  # host: homeassistant.local

  # MQTT broker port (1883 for plain TCP, 8883 for TLS, 443 if fronted by a
  # websocket proxy)
  # port: 1883

  # Transport: "tcp" (raw MQTT) or "websockets" (MQTT-over-WebSocket, useful
  # when the broker is only reachable through an HTTPS reverse proxy)
  # transport: tcp

  # Use TLS for the connection (typically paired with transport: websockets
  # on port 443, or port 8883 for raw TLS)
  # tls: false

  # Broker username, if the broker requires authentication
  # username: my-mqtt-user

  # Broker password. Can also be set via the MQTT_PASSWORD environment
  # variable (recommended for secrets so it's not stored in the config file).
  # password: "CHANGE_ME"

  # Device id used in the published topics: qmk/<device_id>/layer and
  # qmk/<device_id>/availability. Distinguishes multiple keyboards on the
  # same broker.
  # device_id: keyboard1
